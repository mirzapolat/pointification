# Pointification — single self-hosted container. It serves the SPA, runs the
# API, and owns its SQLite database; there is no external database service.
# Fronted by an external Traefik instance (TLS + routing managed outside this
# project).
#
#   cp .env.example .env   # optional: donate link, SMTP
#   docker compose up --build -d
#
# State (the SQLite file and uploaded logos) lives in ./data — back that up.

services:
  pointification:
    build:
      context: .
      args:
        # Inlined into the SPA bundle at build time (Vite).
        VITE_DONATE_URL: ${VITE_DONATE_URL:-}
    image: pointification
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/pointification.db
      LOGO_DIR: /data/logos
      # Optional: without SMTP, new accounts are verified automatically.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./data:/data
    expose:
      - "3000"
    networks:
      - home
    labels:
      traefik.enable: "true"
      traefik.http.routers.pointification.rule: "Host(`pointification.de`)"
      traefik.http.routers.pointification.entrypoints: websecure
      traefik.http.routers.pointification.tls.certresolver: letsencrypt
      traefik.http.routers.pointification.middlewares: secure-headers@file,compress@file
      traefik.http.services.pointification.loadbalancer.server.port: "3000"
    restart: unless-stopped

# Joins the existing Traefik network (created/managed outside this project).
networks:
  home:
    external: true
